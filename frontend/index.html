  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!-- Background & Cursor Elements -->
<canvas id="bg-canvas"></canvas>
<div class="nebula-glow"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<script>
// ====================== STARFIELD + CURSOR GLOW ======================

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, stars = [], shootingStars = [];

// Resize Canvas
function resizeCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Initialize Stars
function initStars() {
    stars = [];
    const count = Math.floor((W * H) / 9000);
    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.4 + 0.4,
            baseAlpha: Math.random() * 0.6 + 0.35,
            tw: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.025 + 0.008,
        });
    }
}
initStars();
window.addEventListener('resize', initStars);

// Shooting Stars
function spawnShootingStar() {
    if (Math.random() < 0.008 && shootingStars.length < 3) {
        const y0 = Math.random() * H * 0.45;
        shootingStars.push({
            x: Math.random() * W * 0.7,
            y: y0,
            len: 0,
            maxLen: 100 + Math.random() * 120,
            speed: 7 + Math.random() * 8,
            alpha: 1
        });
    }
}

// Cursor Glow
const glow = document.getElementById('cursorGlow');
let lastHeart = 0;

function spawnHeart(x, y, burst = false) {
    const now = Date.now();
    if (!burst && now - lastHeart < 80) return;
    lastHeart = now;

    const h = document.createElement('div');
    h.textContent = '❤';
    h.style.position = 'fixed';
    h.style.left = (x + (Math.random() * 32 - 16)) + 'px';
    h.style.top = (y + (Math.random() * 32 - 16)) + 'px';
    h.style.color = burst ? '#ffb3d1' : 'rgba(255, 158, 203, 0.75)';
    h.style.fontSize = (burst ? 14 : 9) + Math.random() * 10 + 'px';
    h.style.pointerEvents = 'none';
    h.style.zIndex = '10000';
    h.style.transition = 'all 1.4s ease';
    document.body.appendChild(h);

    requestAnimationFrame(() => {
        h.style.transform = `translateY(-${70 + Math.random() * 70}px) scale(1.4)`;
        h.style.opacity = '0';
    });

    setTimeout(() => h.remove(), 1600);
}

// Mouse Move
window.addEventListener('mousemove', (e) => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
    glow.style.display = 'block';
    spawnHeart(e.clientX, e.clientY, false);
});

// Mouse Click Burst
window.addEventListener('click', (e) => {
    for (let i = 0; i < 7; i++) {
        setTimeout(() => spawnHeart(e.clientX, e.clientY, true), i * 35);
    }
});

// Draw Animation
function draw() {
    ctx.clearRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        s.tw += s.speed;
        const alpha = s.baseAlpha + Math.sin(s.tw) * 0.35;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 240, 245, ${Math.max(alpha, 0.1)})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Shooting Stars
    spawnShootingStar();
    for (let i = shootingStars.length - 1; i >= 0; i--) {
        const sh = shootingStars[i];
        sh.x += 4;
        sh.y += 3.5;
        sh.len += sh.speed;
        sh.alpha -= 0.018;

        ctx.strokeStyle = `rgba(255, 220, 240, ${sh.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y);
        ctx.lineTo(sh.x - 90, sh.y - 70);
        ctx.stroke();

        if (sh.alpha <= 0) shootingStars.splice(i, 1);
    }

    requestAnimationFrame(draw);
}
draw();
